# No top-level `name:` on purpose — Compose derives the project name from the
# containing directory. Staging and production each get their own checkout in their
# own directory on the VM (see docs/DEPLOYMENT_BHARAT_CLOUD.md), which is what keeps
# their containers/volumes/network from colliding on the same Docker host without any
# extra flags. Container names are intentionally NOT pinned for the same reason.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-crm}
    volumes:
      - crm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm_admin} -d ${POSTGRES_DB:-crm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Bound to the VM's loopback interface only — never the internet. This is not a
    # public port: it exists so a GUI client (pgAdmin, psql) can reach the database via
    # an SSH tunnel to the VM (see docs/DEPLOYMENT_BHARAT_CLOUD.md), without ever
    # exposing Postgres to 0.0.0.0. Staging and production need different host ports
    # here since they run on the same VM — set DB_TUNNEL_PORT in each environment's
    # .env (defaults to 15432 if unset, so this doesn't force a change on directories
    # that predate this).
    ports:
      - "127.0.0.1:${DB_TUNNEL_PORT:-15432}:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      # Passed as separate fields, not pre-assembled into a DATABASE_URL here — a
      # generated password (e.g. from `openssl rand -base64`) can contain "/" or "+",
      # which corrupts a connection-string URL if spliced in unencoded. The backend's
      # entrypoint (see Dockerfile) builds DATABASE_URL itself with proper URL encoding.
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-crm_admin}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-crm}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env, e.g. via openssl rand -base64 48}
    ports:
      - "${BACKEND_PORT:?Set BACKEND_PORT in .env — 8035 for staging, 8045 for production}:4000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:?Set FRONTEND_PORT in .env — 8030 for staging, 8040 for production}:80"

volumes:
  crm_pgdata:
