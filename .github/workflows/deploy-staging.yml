name: Deploy to staging

# Pushes to `staging` deploy here, into a separate checkout/ports from production (see
# deploy-production.yml). `development` is the day-to-day working branch and doesn't
# deploy anywhere by itself — merge into `staging` to test on ports 8030 (frontend) /
# 8035 (backend), then into `main` when it's ready for production.
#
# Fully self-bootstrapping: if ~/apps/crm-staging doesn't exist yet on the VM, this
# clones it and writes .env from the secrets below on its own — no manual SSH setup
# needed beyond the deploy key and firewall access already in place. Once the directory
# exists, later runs just pull and redeploy in place (deploy.sh's normal job).
on:
  push:
    branches: [staging]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          REPO_URL: https://github.com/${{ github.repository }}.git
          POSTGRES_PASSWORD: ${{ secrets.STAGING_POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.STAGING_JWT_SECRET }}
          CORS_ORIGIN: ${{ secrets.STAGING_CORS_ORIGIN }}
          FRONTEND_PORT: "8030"
          BACKEND_PORT: "8035"
          DB_TUNNEL_PORT: "15432"
          DEPLOY_BRANCH: "staging"
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_FORCE_PATH_STYLE: ${{ secrets.S3_FORCE_PATH_STYLE }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: REPO_URL,POSTGRES_PASSWORD,JWT_SECRET,CORS_ORIGIN,FRONTEND_PORT,BACKEND_PORT,DB_TUNNEL_PORT,DEPLOY_BRANCH,S3_ENDPOINT,S3_REGION,S3_BUCKET,S3_ACCESS_KEY_ID,S3_SECRET_ACCESS_KEY,S3_FORCE_PATH_STYLE
          script: |
            set -e
            DIR=~/apps/crm-staging

            if [ ! -d "$DIR/.git" ]; then
              echo "First run — cloning into $DIR"
              mkdir -p ~/apps
              git clone -b staging "$REPO_URL" "$DIR"
            fi

            cd "$DIR"

            if [ ! -f .env ]; then
              echo "No .env yet — writing one from GitHub secrets"
              cat > .env <<ENVEOF
            POSTGRES_USER=crm_admin
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            POSTGRES_DB=crm_staging
            JWT_SECRET=${JWT_SECRET}
            CORS_ORIGIN=${CORS_ORIGIN}
            FRONTEND_PORT=${FRONTEND_PORT}
            BACKEND_PORT=${BACKEND_PORT}
            DB_TUNNEL_PORT=${DB_TUNNEL_PORT}
            DEPLOY_BRANCH=${DEPLOY_BRANCH}
            S3_ENDPOINT=${S3_ENDPOINT}
            S3_REGION=${S3_REGION}
            S3_BUCKET=${S3_BUCKET}
            S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
            S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
            S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE}
            ENVEOF
              chmod 600 .env
            fi

            # One-time fixup for a directory that predates DEPLOY_BRANCH / the
            # staging-branch rename (it was originally cloned from `development`).
            grep -q '^DEPLOY_BRANCH=' .env || echo "DEPLOY_BRANCH=${DEPLOY_BRANCH}" >> .env
            # One-time fixup for a directory that predates CORS_ORIGIN being required --
            # without this, an existing .env from before this change has no CORS_ORIGIN
            # line and the backend container refuses to start (see docker-compose.yml).
            grep -q '^CORS_ORIGIN=' .env || echo "CORS_ORIGIN=${CORS_ORIGIN}" >> .env
            # One-time fixup for a directory that predates S3 attachment storage support --
            # these are optional (opportunity attachments just stay metadata-only without
            # them), but an existing .env needs the lines added for the secrets to take effect.
            grep -q '^S3_ENDPOINT=' .env || echo "S3_ENDPOINT=${S3_ENDPOINT}" >> .env
            grep -q '^S3_REGION=' .env || echo "S3_REGION=${S3_REGION}" >> .env
            grep -q '^S3_BUCKET=' .env || echo "S3_BUCKET=${S3_BUCKET}" >> .env
            grep -q '^S3_ACCESS_KEY_ID=' .env || echo "S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}" >> .env
            grep -q '^S3_SECRET_ACCESS_KEY=' .env || echo "S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}" >> .env
            grep -q '^S3_FORCE_PATH_STYLE=' .env || echo "S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE}" >> .env

            chmod +x deploy.sh
            ./deploy.sh
