name: Deploy to staging

# Pushes to `development` deploy here, into a separate checkout/ports from production
# (see deploy-production.yml). Confirm changes on ports 8030 (frontend) / 8035 (backend)
# before they reach the `production` branch.
#
# Fully self-bootstrapping: if ~/apps/crm-staging doesn't exist yet on the VM, this
# clones it and writes .env from the secrets below on its own — no manual SSH setup
# needed beyond the deploy key and firewall access already in place. Once the directory
# exists, later runs just pull and redeploy in place (deploy.sh's normal job).
on:
  push:
    branches: [development]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          REPO_URL: https://github.com/${{ github.repository }}.git
          POSTGRES_PASSWORD: ${{ secrets.STAGING_POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.STAGING_JWT_SECRET }}
          FRONTEND_PORT: "8030"
          BACKEND_PORT: "8035"
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: REPO_URL,POSTGRES_PASSWORD,JWT_SECRET,FRONTEND_PORT,BACKEND_PORT
          script: |
            set -e
            DIR=~/apps/crm-staging

            if [ ! -d "$DIR/.git" ]; then
              echo "First run — cloning into $DIR"
              mkdir -p ~/apps
              git clone -b development "$REPO_URL" "$DIR"
            fi

            cd "$DIR"

            if [ ! -f .env ]; then
              echo "No .env yet — writing one from GitHub secrets"
              cat > .env <<ENVEOF
            POSTGRES_USER=crm_admin
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            POSTGRES_DB=crm_staging
            JWT_SECRET=${JWT_SECRET}
            FRONTEND_PORT=${FRONTEND_PORT}
            BACKEND_PORT=${BACKEND_PORT}
            ENVEOF
              chmod 600 .env
            fi

            chmod +x deploy.sh
            ./deploy.sh